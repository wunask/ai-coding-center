<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Coding Center — Token Usage</title><style>
:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;background:#0b1220;color:#eef2ff}body{max-width:960px;margin:0 auto;padding:32px 18px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}h1{font-size:clamp(28px,5vw,42px);margin:18px 0 6px}p{color:#a6b3ca}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:28px}.card{background:#141f32;border:1px solid #2b3a53;border-radius:18px;padding:24px}.name{font-size:20px;font-weight:700}.number{font-size:38px;font-weight:800;margin:18px 0}.stats{display:grid;grid-template-columns:1fr auto;gap:12px;color:#a6b3ca}.stats strong{color:#eef2ff}button{border:1px solid #3e5a83;background:#1c3455;color:white;border-radius:10px;padding:10px 18px;cursor:pointer}small{color:#94a3b8}a{color:#93c5fd}</style></head><body>
<header><div><a href="/">← AI Coding Center</a><h1>Token Usage</h1><p>Local Claude Code & Codex CLI activity</p></div><button onclick="load()">Refresh</button></header><main class="cards" id="cards"><p>Loading local token records…</p></main><p id="note"></p><small>Usage is estimated from locally saved session records, not a provider billing statement. Cached tokens are shown separately.</small>
<script>
const n=x=>Number(x||0).toLocaleString();const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){try{let r=await fetch('/api/tokens',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();let cards=[['Claude Code',d.claude,d.claude_records,[['Input','input_tokens'],['Output','output_tokens'],['Cache read','cache_read_input_tokens'],['Cache write','cache_creation_input_tokens']]],['Codex',d.codex,d.codex_sessions,[['Input (includes cache)','input_tokens'],['Output','output_tokens'],['Cached input','cached_input_tokens'],['Reasoning output (subset)','reasoning_output_tokens']]]];document.getElementById('cards').innerHTML=cards.map(([name,u,count,fields])=>'<section class="card"><div class="name">'+esc(name)+'</div><div class="number">'+n(u.total_tokens)+' <small>tokens</small></div><div class="stats">'+fields.map(([label,key])=>'<span>'+esc(label)+'</span><strong>'+n(u[key])+'</strong>').join('')+'</div><p>'+n(count)+' '+(name==='Codex'?'sessions':'message records')+'</p></section>').join('');document.getElementById('note').textContent=d.note;}catch(e){document.getElementById('cards').textContent='Unable to load token records: '+e.message;}}
load();setInterval(load,30000);
</script></body></html>
